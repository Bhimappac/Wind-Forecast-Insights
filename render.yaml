services:
  - type: web
    name: wind-forecast-insights-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ELEXON_BASE_URL
        value: "https://data.elexon.co.uk/bmrs/api/v1"
      - key: DATA_DIR
        value: "/app/data"
    healthCheckPath: /api/health
